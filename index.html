<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>spin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff4d2e'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230a0a0b'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0a0b;
    --fg: #f4f2ee;
    --dim: color-mix(in srgb, var(--fg) 62%, transparent);
    --title-color: #fff;
    --title-blend: difference;
    --title-weight: 700;
    --title-case: uppercase;
    --accent: #ff4d2e;
    --display: Bahnschrift, "DIN Condensed", "Arial Narrow", "Liberation Sans Narrow", "Segoe UI", "Noto Sans", sans-serif;
    --mono: "Cascadia Code", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", "Noto Sans Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { font: 13px/1.4 var(--mono); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }

  /* The title inverts whatever passes behind it, including the ring. */
  #now {
    position: fixed; left: 24px; right: 24px; bottom: 64px;
    mix-blend-mode: var(--title-blend); pointer-events: none;
  }
  #artist { color: var(--title-color); margin-bottom: 8px; letter-spacing: .04em; min-height: 1.4em; }
  #title {
    font-family: var(--display); font-weight: var(--title-weight); font-stretch: 75%;
    line-height: .92; letter-spacing: -.02em; text-transform: var(--title-case);
    color: var(--title-color); overflow-wrap: normal; font-size: 12vw; padding-bottom: .16em;
  }

  #bar {
    position: fixed; left: 24px; right: 24px; bottom: 14px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px 12px; min-height: 40px;
  }
  #time { font-variant-numeric: tabular-nums; }
  #transport { display: flex; align-items: center; justify-content: center; gap: 6px; }
  #tools { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
  #bar button {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 50%; color: var(--fg); transition: color .15s, background .15s, transform .1s;
  }
  #bar button:hover { color: var(--accent); background: color-mix(in srgb, var(--fg) 10%, transparent); }
  #bar button:active { transform: scale(.92); }
  #bar button.on { color: var(--accent); }
  #bar svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #b-prev svg, #b-next svg, #b-play svg, #bar svg .solid { fill: currentColor; stroke: none; }
  #bar #b-play { width: 52px; height: 52px; margin: 0 4px; background: var(--fg); color: var(--bg); }
  #bar #b-play.on { color: var(--bg); }
  #bar #b-play:hover { background: var(--accent); color: var(--bg); }
  #bar #b-play svg { width: 26px; height: 26px; }
  #bar #b-repeat[data-mode="one"]::after {
    content: '1'; position: absolute; right: 4px; bottom: 4px; min-width: 13px; height: 13px; border-radius: 7px;
    font: 700 9px/13px var(--mono); text-align: center; background: var(--accent); color: var(--bg);
  }
  #vol-slider { width: 84px; margin: 0 8px 0 2px; accent-color: var(--accent); cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  #queue {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw);
    display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(24px);
    border-left: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
    transform: translateX(100%); visibility: hidden;
    transition: transform .28s cubic-bezier(.2, .8, .2, 1), visibility .28s;
  }
  /* Visible immediately on open, otherwise the filter cannot take focus from the / key. */
  #queue.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
  #filter {
    font: inherit; color: var(--fg); background: none; border: 0;
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 14%, transparent); padding: 18px 20px; outline: 0;
  }
  #filter:focus { border-bottom-color: var(--accent); }
  #filter::placeholder { color: var(--dim); }
  #list { flex: 1; overflow-y: auto; padding: 6px 0; scrollbar-width: thin; }
  .row {
    display: flex; gap: 14px; width: 100%; padding: 7px 20px; text-align: start;
    color: var(--fg);
  }
  .row:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
  .row[hidden] { display: none; }
  .row i { font-style: normal; color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.current, .row.current i { color: var(--accent); }

  #toast {
    position: fixed; top: 20px; left: 24px; color: var(--accent);
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  #drop {
    position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity .12s;
  }
  body.dragging #drop { opacity: 1; }

  /* Desktop app: no system title bar, so the top strip moves the window. */
  #dragbar { display: none; }
  body.native #dragbar { display: block; position: fixed; top: 0; left: 0; right: 0; height: 36px; -webkit-app-region: drag; }
  body.native #queue { padding-top: 36px; }
  body.native #toast { top: 44px; }

  #lights, #mini, #mini-controls, #b-mini { display: none; }
  body.native #bar #b-mini { display: inline-flex; }
  body.native #lights {
    display: flex; position: fixed; top: 0; right: 0; z-index: 3; -webkit-app-region: no-drag;
  }
  #lights button { display: flex; align-items: center; justify-content: center; width: 40px; height: 32px; color: var(--dim); }
  #lights button:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 12%, transparent); }
  #lights #w-close:hover { color: #fff; background: #e81123; }
  #lights svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
  body.mini #lights button { width: 28px; height: 26px; }

  /* Mini mode: the floating widget. The canvas keeps drawing the disc on the left. */
  body.mini { overflow: hidden; }
  body.mini #dragbar { height: 26px; }
  body.mini #bar, body.mini #queue { display: none; }
  body.native.mini #now {
    display: flex; flex-direction: column-reverse; justify-content: flex-end;
    top: 28px; left: 118px; right: 14px; bottom: auto; height: 46px;
    mix-blend-mode: normal; -webkit-app-region: drag;
  }
  body.mini #title {
    padding-bottom: 0; color: var(--fg); font-family: var(--display); font-size: 19px; line-height: 1.25; letter-spacing: 0; text-transform: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.mini #artist {
    color: var(--dim); font-size: 12px; margin: 0; min-height: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body.mini #mini { display: block; position: fixed; left: 118px; right: 14px; top: 78px; }
  #mini-times { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #mini-track { display: flex; align-items: center; height: 14px; cursor: pointer; touch-action: none; }
  #mini-rail { flex: 1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--fg) 18%, transparent); overflow: hidden; }
  #mini-fill { display: block; height: 100%; width: 0; background: var(--accent); }
  body.mini #mini-controls {
    display: flex; gap: 2px; position: fixed; top: 3px; left: 10px; -webkit-app-region: no-drag;
  }
  #mini-controls button { display: flex; padding: 2px; color: var(--fg); }
  #mini-controls button:hover { color: var(--accent); }
  #mini-controls svg { width: 16px; height: 16px; fill: currentColor; }
  body.native.mini #toast { top: 6px; left: 84px; right: 92px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Game mode: only the record stays on screen until the pointer comes near. */
  body.compact #now, body.compact #mini, body.compact #lights, body.compact #mini-controls,
  body.compact #dragbar, body.compact #toast { display: none !important; }

  #sheet {
    position: fixed; inset: 0; z-index: 2; display: none; overflow-y: auto;
    padding: 56px 24px 32px; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(24px);
  }
  #sheet.open { display: block; }
  #sheet > div { max-width: 760px; margin: 0 auto; }
  .sheet-big {
    font-family: var(--display); font-weight: var(--title-weight); font-stretch: 75%; line-height: .95;
    letter-spacing: -.02em; text-transform: var(--title-case); font-size: clamp(56px, 13vw, 150px); color: var(--accent);
  }
  .sheet-sub { color: var(--dim); margin: 10px 0 28px; }
  .sheet-row {
    display: flex; align-items: baseline; gap: 14px; width: 100%; padding: 7px 0; text-align: start;
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
  }
  .sheet-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-row i { font-style: normal; color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }
  .sheet-row.current, .sheet-row.current i { color: var(--accent); }
  .sheet-row input {
    flex: 1; min-width: 0; font: inherit; color: var(--fg); background: none; border: 0;
    border-bottom: 1px solid var(--accent); outline: 0;
  }
  .sheet-row .crate-open { flex: 1; min-width: 0; text-align: start; color: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-row .crate-open:hover, .sheet-row .crate-action:hover { color: var(--accent); }
  .sheet-row .crate-action { color: var(--dim); }
  .sheet-add { padding: 12px 0; color: var(--dim); }
  .sheet-add:hover { color: var(--accent); }
  .sheet-title { margin: 26px 0 8px; color: var(--dim); }

  @media (pointer: coarse) { #bar button { min-height: 44px; } }
  @media (max-width: 720px) {
    #now { left: 16px; right: 16px; }
    #bar { left: 16px; right: 16px; }
    #bar { grid-template-columns: 1fr; justify-items: center; }
  #vol-slider { width: 64px; }
    #time { width: 100%; }
    #toast { left: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { #queue { transition: none; } }

  /* Style panel: sits beside the record so every change is visible as it happens. */
  #style {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); z-index: 2;
    overflow-y: auto; padding: 44px 18px 24px; scrollbar-width: thin;
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(24px);
    border-left: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
    display: none;
  }
  body.styling #style { display: block; }
  body.native #style { top: 32px; padding-top: 12px; }
  body.styling #now, body.styling #bar { right: 404px; }
  #style h2 { font: inherit; color: var(--dim); margin: 20px 0 8px; }
  #style h2:first-of-type { margin-top: 0; }
  #style .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #style .chip {
    padding: 5px 9px; border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent); border-radius: 6px; color: var(--fg);
  }
  #style .chip:hover { border-color: var(--accent); }
  #style .chip.on { border-color: var(--accent); color: var(--accent); }
  #style .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #style .thumb {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0 4px;
    border: 1px solid transparent; border-radius: 8px; color: var(--dim); font-size: 11px;
  }
  #style .thumb:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
  #style .thumb.on { border-color: var(--accent); color: var(--accent); }
  #style .thumb canvas { width: 64px; height: 64px; }
  #style .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
  #style .field > span { flex: none; }
  #style input[type=color] { width: 44px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; }
  #style input[type=range] { flex: 1; min-width: 0; max-width: 190px; accent-color: var(--accent); }
  #style select, #style input[type=text] {
    flex: 1; min-width: 0; max-width: 220px; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent); border-radius: 6px; padding: 4px 6px;
  }
  #style .libtile {
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 5px 2px 4px;
    border: 1px solid transparent; border-radius: 8px; color: var(--dim); font-size: 11px;
  }
  #style .libtile:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
  #style .libtile.on { border-color: var(--accent); color: var(--accent); }
  #style .libtile canvas { width: 64px; height: 64px; }
  #style .libtile span { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #style .chips { margin-top: 6px; }
  #style .note { color: var(--accent); margin-top: 6px; }
  #style .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="dragbar"></div>
<div id="lights">
  <button id="w-min" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
  <button id="w-mode" aria-label="Switch between mini and full view" title="Mini / full (e)"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
  <button id="w-close" aria-label="Close" title="Close"><svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
</div>
<div id="mini-controls">
  <button id="m-prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button id="m-play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="m-play-icon" d="M7 5v14l12-7z"/></svg></button>
  <button id="m-next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
</div>
<div id="mini">
  <div id="mini-times"><span id="mini-cur">--:--</span><span id="mini-dur">--:--</span></div>
  <div id="mini-track"><div id="mini-rail"><span id="mini-fill"></span></div></div>
</div>

<div id="now">
  <div id="artist" dir="auto"></div>
  <h1 id="title" dir="auto">Open a folder</h1>
</div>

<div id="bar">
  <span id="time" aria-live="off">--:-- / --:--</span>
  <div id="transport">
    <button id="b-shuffle" aria-label="Shuffle" aria-pressed="false" title="Shuffle (s)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg></button>
    <button id="b-prev" aria-label="Previous track" title="Previous (p)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="b-play" title="Play or pause (space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="b-play-icon" d="M7 5v14l12-7z"/></svg><span id="play-label" class="sr">play</span></button>
    <button id="b-next" aria-label="Next track" title="Next (n)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button id="b-repeat" title="Repeat: all, one or off (r)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg><span class="sr">Repeat: </span><span id="repeat-label" class="sr">all</span></button>
  </div>
  <div id="tools">
    <button id="b-mute" title="Mute (m)" aria-label="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M4 9v6h4l5 4V5L8 9z"/><path id="vol-waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span id="vol-label" class="sr">80</span></button>
    <input id="vol-slider" type="range" min="0" max="1" step="0.01" aria-label="Volume" title="Volume (up and down arrows)">
    <button id="b-open" aria-label="Open a folder" title="Open a folder (o)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button id="b-queue" aria-expanded="false" aria-label="Queue" title="Queue (q)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h10M17 13v7l4-3.5z"/></svg><span id="count" class="sr">0</span></button>
    <button id="b-style" aria-label="Style" title="Style (t)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-1.3-1-1.7-1-2.7 0-.9.7-1.5 1.6-1.5H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8zM7.5 12h.01M10 7.5h.01M15 7.5h.01"/></svg></button>
    <button id="b-mini" aria-label="Small widget" title="Small widget (e)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM12 12h8v8h-8z"/></svg></button>
    <button id="b-more" aria-label="All keys and features" title="More (?)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
  </div>
</div>

<aside id="queue" aria-label="Queue">
  <input id="filter" type="search" placeholder="/ filter, enter to play, esc to close" aria-label="Filter tracks" autocomplete="off" spellcheck="false">
  <div id="list"></div>
</aside>

<aside id="style" aria-label="Style"></aside>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<div id="drop"></div>
<input id="picker" type="file" webkitdirectory multiple hidden>
<input id="sticker-picker" type="file" accept="image/*" hidden>
<input id="theme-file" type="file" hidden>

<audio id="audio" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const AUDIO_EXT = /\.(mp3|flac|m4a|aac|ogg|oga|opus|wav|weba|webm)$/i;
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem('spin.' + key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('spin.' + key, JSON.stringify(value)); } catch {}
  },
};

/* ---------- theme: everything a person can restyle ---------- */

const DEFAULT_THEME = {
  bg: '#0a0a0b', fg: '#f4f2ee', accentMode: 'auto', accent: '#ff4d2e',
  titleColor: 'invert', displayFont: '', uiFont: '', titleWeight: 700, titleCase: 'upper',
  disc: 'vinyl', discColor: '#131315', labelMode: 'accent', labelColor: '#ff4d2e',
  discText: '🎧', imageShape: 'circle', cover: 'fill', spin: 1,
  ring: 'bars', glow: 1, size: 1, bgDim: .55, fonts: [],
};
const THEME_CHOICES = {
  accentMode: ['auto', 'fixed'], titleColor: ['invert', 'fg', 'accent'], titleCase: ['upper', 'none'],
  labelMode: ['accent', 'custom'], cover: ['fill', 'label', 'off'],
  imageShape: ['circle', 'rounded', 'square', 'hex', 'star', 'heart', 'original'],
  ring: ['bars', 'dots', 'blocks', 'line', 'thin', 'none'],
};
const THEME_RANGES = { titleWeight: [100, 900], spin: [-3, 3], glow: [0, 2], size: [.6, 1.25], bgDim: [0, 1] };
const THEME_COLOURS = ['bg', 'fg', 'accent', 'discColor', 'labelColor'];
const DISC_NAMES = ['vinyl', 'gold', 'clear', 'splatter', 'solid', 'cd', 'cassette', 'neon', 'wire', 'vortex', 'radar', 'shuriken', 'gear', 'sun', 'planet', 'flower', 'pixel', 'emoji', 'image', 'speaker', 'platter', 'reel', 'minidisc', 'wheel', 'shellac', 'eq', 'plasma', 'lava', 'matrix', 'stars', 'pulse', 'fire', 'hypno', 'scope', 'glitch', 'mandala', 'aurora'];
const PRESETS = {
  Spin: {},
  Midnight: { bg: '#0b1026', fg: '#e8ecff', discColor: '#151b3a', titleColor: 'fg', accentMode: 'fixed', accent: '#6ea8ff', disc: 'clear', ring: 'line' },
  Paper: { bg: '#f3efe6', fg: '#1d1b18', discColor: '#1d1b18', titleColor: 'fg', accentMode: 'fixed', accent: '#d1381f', displayFont: 'Georgia', titleCase: 'none', titleWeight: 400, glow: .4, ring: 'thin' },

/* Themes can come from an imported file, so only known keys with sane values get through. */
function cleanTheme(input) {
  const out = { ...DEFAULT_THEME };
  if (!input || typeof input !== 'object') return out;
  for (const key of THEME_COLOURS) if (/^#[0-9a-f]{6}$/i.test(input[key])) out[key] = input[key];
  for (const [key, list] of Object.entries(THEME_CHOICES)) if (list.includes(input[key])) out[key] = input[key];
  for (const [key, [min, max]] of Object.entries(THEME_RANGES)) {
    if (typeof input[key] === 'number' && isFinite(input[key])) out[key] = Math.max(min, Math.min(max, input[key]));
  }
  for (const key of ['displayFont', 'uiFont', 'discText']) if (typeof input[key] === 'string') out[key] = input[key].slice(0, 80);
  if (DISC_NAMES.includes(input.disc)) out.disc = input.disc;
  if (Array.isArray(input.fonts)) out.fonts = input.fonts.filter(f => typeof f === 'string').slice(0, 50);
  return out;
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: n >> 16, g: (n >> 8) & 255, b: n & 255 };
}
function luminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; };
  return .2126 * f(r) + .7152 * f(g) + .0722 * f(b);
}
const isLight = hex => luminance(hex) > .4;
function contrast(a, b) {
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + .05) / (lo + .05);
}
function fgAlpha(a, hex = theme.fg) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- memory: what Spin learns from listening, stored only on this machine ---------- */

let memory = { tracks: {}, crates: [], gameScale: 1 };
let memoryDirty = false;

function saveMemory() {
  if (!memoryDirty) return;
  memoryDirty = false;
  if (window.spinNative) window.spinNative.saveMemory(JSON.stringify(memory));
  else store.set('memory', memory);
}
setInterval(saveMemory, 15000);

const peek = t => memory.tracks[t.key];
function record(t) {
  memoryDirty = true;
  return memory.tracks[t.key] ||= { plays: 0, finishes: 0, skips: 0, seconds: 0, hours: {}, years: {}, marks: [] };
}

function historySize() {
  return Object.values(memory.tracks).reduce((sum, r) => sum + r.plays, 0);
}

/* Songs you finish come up more, songs you skip come up less, nothing ever disappears. */
function trackWeight(t, now = new Date()) {
  const r = peek(t);
  if (!r) return 1;
  let weight = (r.finishes + 2) / (r.finishes + r.skips * 2 + 2) * (1 + Math.min(r.finishes, 20) * .03);
  if (r.last && now - r.last < 3 * 3600e3) weight *= .6;

  /* Once there is enough history, lean towards what you usually play at this hour. */
  const total = Object.values(r.hours).reduce((a, b) => a + b, 0);
  if (total >= 5 && historySize() >= 50) {
    const h = now.getHours();
    const near = [h + 23, h, h + 1].reduce((sum, x) => sum + (r.hours[x % 24] || 0), 0);
    weight *= .7 + near / total * 2.4;
  }
  return Math.max(.05, weight);
}

function noteListening() {
  const t = current();
  const now = audio.currentTime;
  const delta = now - state.lastTime;
  state.lastTime = now;
  if (!t || audio.paused || delta <= 0 || delta > 2) return;
  const r = record(t);
  const year = new Date().getFullYear();
  r.seconds += delta;
  r.years[year] = (r.years[year] || 0) + delta;
  r.title = t.title;
  r.artist = t.artist;
  state.heard += delta;
  if (!state.counted && isFinite(audio.duration) && state.heard >= Math.min(30, audio.duration * .5)) {
    state.counted = true;
    r.plays++;
    r.last = Date.now();
    const hour = new Date().getHours();
    r.hours[hour] = (r.hours[hour] || 0) + 1;
  }
}

function skipNext() {
  const t = current();
  if (t && isFinite(audio.duration) && state.heard < Math.min(30, audio.duration * .4)) record(t).skips++;
  step(1, true);
}

/* ---------- folder memory: a directory handle survives reloads in IndexedDB ---------- */

function handleDb(mode, run) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('spin', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const req = run(open.result.transaction('kv', mode).objectStore('kv'));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    };
  });
}
const saveHandle = handle => handleDb('readwrite', s => s.put(handle, 'folder')).catch(() => {});
const loadHandle = () => handleDb('readonly', s => s.get('folder')).catch(() => null);

let savedHandle = null;

/* ---------- reading folders ---------- */

async function walkHandle(dir, prefix, out) {
  for await (const entry of dir.values()) {
    const path = prefix + entry.name;
    if (entry.kind === 'directory') await walkHandle(entry, path + '/', out);
    else if (AUDIO_EXT.test(entry.name)) out.push({ path, getFile: () => entry.getFile() });
  }
  return out;
}

async function walkEntry(entry, out) {
  if (entry.isFile) {
    if (AUDIO_EXT.test(entry.name)) {
      const path = entry.fullPath.replace(/^\//, '');
      out.push({ path, getFile: () => new Promise((ok, no) => entry.file(ok, no)) });
    }
    return;
  }
  const reader = entry.createReader();
  for (;;) {
    const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
    if (!batch.length) return;
    for (const child of batch) await walkEntry(child, out);
  }
}

/* The part of the File interface tag reading needs, fetching only the bytes it asks for. */
function diskFile(full, size, base = 0) {
  return {
    size,
    slice(start = 0, end = size) {
      const from = base + start;
      return {
        arrayBuffer: async () => {
          const bytes = await native.readRange(full, from, Math.max(0, end - start));
          return bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        },
      };
    },
  };
}

/* ---------- library and queue ---------- */

function guessFromPath(path) {
  const parts = path.split('/');
  const base = parts.pop().replace(/\.[^.]+$/, '').replace(/^\d{1,3}[\s._-]+/, '').replace(/_/g, ' ');
  const split = base.match(/^(.+?)\s+-\s+(.+)$/);
  if (split) return { artist: split[1], title: split[2] };
  return { artist: parts.pop() || '', title: base };
}

function setLibrary(tracks, folder, autoplay = true) {
  if (!tracks.length) return toast('no audio files in ' + (folder || 'that folder'));
  state.tracks = tracks
    .sort((a, b) => collator.compare(a.path, b.path))
    .map(t => ({ ...t, ...guessFromPath(t.path), tagged: false, key: folder + '/' + t.path }));
  state.folder = folder;
  state.failures = 0;
  $('count').textContent = tracks.length;
  buildOrder(0);
  renderList();

  const last = store.get('last:' + folder, store.get('last', null));
  const resume = last && last.folder === folder ? state.tracks.findIndex(t => t.path === last.path) : -1;
  if (resume >= 0) {
    state.pos = state.order.indexOf(resume);
    playCurrent(last.time, autoplay);
  } else {
    state.pos = 0;
    playCurrent(0, autoplay);
  }
}

function buildOrder(keepIndex) {
  const n = state.tracks.length;
  state.order = Array.from({ length: n }, (_, i) => i);
  if (state.shuffle) {
    /* Weighted random order: each track draws a random rank, biased by how much you like it. */
    const now = new Date();
    const rank = state.order.map(i => Math.pow(Math.random(), 1 / trackWeight(state.tracks[i], now)));
    state.order.sort((a, b) => rank[b] - rank[a]);
    const at = state.order.indexOf(keepIndex);
    [state.order[0], state.order[at]] = [state.order[at], state.order[0]];
    state.pos = 0;
  } else {
    state.pos = keepIndex;
  }
}

function renderList() {
  const width = String(state.tracks.length).length;
  $('list').replaceChildren(...state.tracks.map((t, i) => {
    const row = document.createElement('button');
    row.className = 'row';
    const num = document.createElement('i');
    num.textContent = String(i + 1).padStart(width, '0');
    const name = document.createElement('span');
    name.dir = 'auto';
    name.textContent = rowLabel(t);
    row.append(num, name);
    row.addEventListener('click', () => { state.pos = state.order.indexOf(i); playCurrent(); });
    t.row = row;
    return row;
  }));
  applyFilter();
}

/* ---------- embedded tags: ID3v2.3/2.4 and FLAC, read only for the track being played ---------- */

const decoders = { 0: 'latin1', 1: 'utf-16', 2: 'utf-16be', 3: 'utf-8' };
const clean = s => s.replace(/\0+$/, '').split('\0')[0].trim();

function nullEnd(bytes, from, enc) {
  if (enc === 1 || enc === 2) {
    for (let i = from; i + 1 < bytes.length; i += 2) if (!bytes[i] && !bytes[i + 1]) return i + 2;
  } else {
    const i = bytes.indexOf(0, from);
    if (i >= 0) return i + 1;
  }
  return bytes.length;
}

async function readId3(file, head) {
  const version = head[3];
  if (version < 2) return {};
  const size = (head[6] << 21) | (head[7] << 14) | (head[8] << 7) | head[9];
  const bytes = new Uint8Array(await file.slice(10, 10 + Math.min(size, 3e7)).arrayBuffer());
  const view = new DataView(bytes.buffer);
  const tags = {};
  const old = version === 2;
  const headerSize = old ? 6 : 10;
  let at = 0;
  if (!old && head[5] & 0x40) {
    at = version === 4
      ? (bytes[0] << 21) | (bytes[1] << 14) | (bytes[2] << 7) | bytes[3]
      : view.getUint32(0) + 4;
  }
  while (at + headerSize <= bytes.length && bytes[at]) {
    const id = String.fromCharCode(...bytes.subarray(at, at + (old ? 3 : 4)));
    const len = old
      ? (bytes[at + 3] << 16) | (bytes[at + 4] << 8) | bytes[at + 5]
      : version === 4
        ? (bytes[at + 4] << 21) | (bytes[at + 5] << 14) | (bytes[at + 6] << 7) | bytes[at + 7]
        : view.getUint32(at + 4);
    const body = bytes.subarray(at + headerSize, at + headerSize + len);
    if (id === 'TIT2' || id === 'TPE1' || id === 'TT2' || id === 'TP1') {
      const text = clean(new TextDecoder(decoders[body[0]] || 'latin1').decode(body.subarray(1)));
      if (id === 'TIT2' || id === 'TT2') tags.title = text; else tags.artist = text;
    } else if (id === 'APIC' && !tags.picture) {
      const enc = body[0];
      const mimeEnd = body.indexOf(0, 1);
      const mime = new TextDecoder('latin1').decode(body.subarray(1, mimeEnd));
      const start = nullEnd(body, mimeEnd + 2, enc);
      tags.picture = new Blob([body.slice(start)], { type: mime.includes('/') ? mime : 'image/jpeg' });
    } else if (id === 'PIC' && !tags.picture) {
      const start = nullEnd(body, 5, body[0]);
      const png = String.fromCharCode(...body.subarray(1, 4)).toUpperCase() === 'PNG';
      tags.picture = new Blob([body.slice(start)], { type: png ? 'image/png' : 'image/jpeg' });
    }
    at += headerSize + len;
  }
  return tags;
}

/* Vorbis comments are shared by FLAC, Ogg Vorbis and Opus. */
function readVorbisComments(bytes, tags) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const utf8 = new TextDecoder();
  let p = 4 + view.getUint32(0, true);
  const count = view.getUint32(p, true);
  p += 4;
  for (let i = 0; i < count && p + 4 <= bytes.length; i++) {
    const n = view.getUint32(p, true);
    const entry = utf8.decode(bytes.subarray(p + 4, p + 4 + n));
    p += 4 + n;
    const eq = entry.indexOf('=');
    const key = entry.slice(0, eq).toUpperCase();
    if (key === 'TITLE') tags.title = entry.slice(eq + 1);
    if (key === 'ARTIST') tags.artist = entry.slice(eq + 1);
    if (key === 'METADATA_BLOCK_PICTURE' && !tags.picture) {
      tags.picture = readFlacPicture(Uint8Array.from(atob(entry.slice(eq + 1)), c => c.charCodeAt(0)));
    }
  }
}

function readFlacPicture(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const mimeLen = view.getUint32(4);
  const mime = new TextDecoder().decode(bytes.subarray(8, 8 + mimeLen));
  let p = 8 + mimeLen;
  p += 4 + view.getUint32(p) + 16;
  const dataLen = view.getUint32(p);
  return new Blob([bytes.slice(p + 4, p + 4 + dataLen)], { type: mime });
}

async function readFlac(file) {
  const tags = {};
  let at = 4;
  for (;;) {
    const h = new Uint8Array(await file.slice(at, at + 4).arrayBuffer());
    if (h.length < 4) return tags;
    const type = h[0] & 0x7f;
    const len = (h[1] << 16) | (h[2] << 8) | h[3];
    if (type === 4 || type === 6) {
      const bytes = new Uint8Array(await file.slice(at + 4, at + 4 + len).arrayBuffer());
      if (type === 4) readVorbisComments(bytes, tags);
      else if (!tags.picture) tags.picture = readFlacPicture(bytes);
    }
    if (h[0] & 0x80) return tags;
    at += 4 + len;
  }
}

/* The second Ogg packet holds the comments, usually spread over the first few pages. */
async function readOgg(file) {
  const data = new Uint8Array(await file.slice(0, 8e6).arrayBuffer());
  const packets = [[]];
  let at = 0;
  while (at + 27 <= data.length && packets.length < 3 && data[at] === 0x4f && data[at + 1] === 0x67) {
    const segments = data[at + 26];
    let body = at + 27 + segments;
    for (let i = 0; i < segments; i++) {
      const lace = data[at + 27 + i];
      packets[packets.length - 1].push(data.subarray(body, body + lace));
      body += lace;
      if (lace < 255) packets.push([]);
    }
    at = body;
  }
  if (!packets[1]) return {};
  const length = packets[1].reduce((sum, part) => sum + part.length, 0);
  const packet = new Uint8Array(length);
  let filled = 0;
  for (const part of packets[1]) {
    packet.set(part, filled);
    filled += part.length;
  }
  const opus = String.fromCharCode(...packet.subarray(0, 8)) === 'OpusTags';
  const vorbis = String.fromCharCode(...packet.subarray(1, 7)) === 'vorbis';
  if (!opus && !vorbis) return {};
  const tags = {};
  readVorbisComments(packet.subarray(opus ? 8 : 7), tags);
  return tags;
}

/* M4A: moov > udta > meta > ilst. The moov atom can sit at either end of the file. */
async function readMp4(file) {
  const atomName = bytes => String.fromCharCode(...bytes);
  let at = 0, moov = null;
  while (at + 8 <= file.size) {
    const h = new Uint8Array(await file.slice(at, at + 16).arrayBuffer());
    const view = new DataView(h.buffer);
    let size = view.getUint32(0);
    if (size === 1) size = Number(view.getBigUint64(8));
    else if (size === 0) size = file.size - at;
    if (size < 8) return {};
    if (atomName(h.subarray(4, 8)) === 'moov') {
      moov = new Uint8Array(await file.slice(at + 8, at + Math.min(size, 6e7)).arrayBuffer());
      break;
    }
    at += size;
  }
  if (!moov) return {};
  const find = (bytes, name, skip = 0) => {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let p = skip;
    while (p + 8 <= bytes.length) {
      const size = view.getUint32(p);
      if (size < 8) return null;
      if (atomName(bytes.subarray(p + 4, p + 8)) === name) return bytes.subarray(p + 8, p + size);
      p += size;
    }
    return null;
  };
  const udta = find(moov, 'udta');
  const meta = udta && find(udta, 'meta', 0);
  const ilst = meta && (find(meta, 'ilst', 4) || find(meta, 'ilst', 0));
  if (!ilst) return {};
  const value = name => {
    const item = find(ilst, name);
    const data = item && find(item, 'data');
    return data ? { type: new DataView(data.buffer, data.byteOffset).getUint32(0), body: data.subarray(8) } : null;
  };
  const text = name => {
    const v = value(name);
    return v ? new TextDecoder().decode(v.body) : undefined;
  };
  const tags = { title: text('\xa9nam'), artist: text('\xa9ART') || text('aART') };
  const cover = value('covr');
  if (cover) tags.picture = new Blob([cover.body.slice()], { type: cover.type === 14 ? 'image/png' : 'image/jpeg' });
  return tags;
}

/* WAV: RIFF chunks, looking for LIST/INFO names or an embedded id3 chunk. */
async function readWav(file) {
  let at = 12;
  const tags = {};
  while (at + 8 <= file.size) {
    const h = new Uint8Array(await file.slice(at, at + 12).arrayBuffer());
    if (h.length < 8) break;
    const id = String.fromCharCode(...h.subarray(0, 4)).toLowerCase();
    const size = new DataView(h.buffer).getUint32(4, true);
    if (id === 'list' && String.fromCharCode(...h.subarray(8, 12)) === 'INFO' && size < 1e6) {
      const bytes = new Uint8Array(await file.slice(at + 12, at + 8 + size).arrayBuffer());
      const view = new DataView(bytes.buffer);
      let p = 0;
      while (p + 8 <= bytes.length) {
        const key = String.fromCharCode(...bytes.subarray(p, p + 4));
        const n = view.getUint32(p + 4, true);
        const value = clean(new TextDecoder().decode(bytes.subarray(p + 8, p + 8 + n)));
        if (key === 'INAM' && value) tags.title = value;
        if (key === 'IART' && value) tags.artist = value;
        p += 8 + n + (n & 1);
      }
    } else if ((id === 'id3 ') && size < 3e7) {
      const inner = {
        slice: (a, b) => file.slice(at + 8 + a, at + 8 + b),
      };
      const head = new Uint8Array(await inner.slice(0, 10).arrayBuffer());
      Object.assign(tags, await readId3(inner, head));
    }
    at += 8 + size + (size & 1);
  }
  return tags;
}

async function readId3v1(file) {
  if (file.size < 128) return {};
  const b = new Uint8Array(await file.slice(file.size - 128, file.size).arrayBuffer());
  if (String.fromCharCode(b[0], b[1], b[2]) !== 'TAG') return {};
  const text = (from, to) => clean(new TextDecoder('latin1').decode(b.subarray(from, to)));
  return { title: text(3, 33) || undefined, artist: text(33, 63) || undefined };
}

async function readTags(file) {
  try {
    const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const magic = String.fromCharCode(...head.subarray(0, 4));
    if (magic.startsWith('ID3')) {
      const tags = await readId3(file, head);
      return tags.title ? tags : { ...await readId3v1(file), ...tags };
    }
    if (magic === 'fLaC') return await readFlac(file);
    if (magic === 'OggS') return await readOgg(file);
    if (magic === 'RIFF') return await readWav(file);
    if (String.fromCharCode(...head.subarray(4, 8)) === 'ftyp') return await readMp4(file);
    return await readId3v1(file);
  } catch {}
  return {};
}

/* ---------- playback ---------- */

async function playCurrent(startAt = 0, autoplay = true) {
  const t = current();
  if (!t) return;
  const id = ++state.loadId;
  scratch = null;
  state.scrub = null;
  state.heard = 0;
  state.counted = false;
  state.lastTime = 0;
  state.cued = !autoplay;
  loadWear(t);
  applySongVolume(t);
  initAudioGraph();
  showTrack(t);
  markCurrent(t);
  try {
    const file = await t.getFile();
    if (id !== state.loadId) return;
    if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
    state.objectUrl = t.url ? null : URL.createObjectURL(file);
    /* Streams come from a custom scheme, so CORS mode is what lets the visualizer read them. */
    audio.crossOrigin = t.url ? 'anonymous' : null;
    audio.src = t.url || state.objectUrl;
    if (startAt) audio.addEventListener('loadedmetadata', () => { audio.currentTime = startAt; }, { once: true });
    if (autoplay) await audio.play().catch(err => { if (err.name === 'NotAllowedError') updatePlayLabel(); });
    if (id !== state.loadId) return;
    applyTags(t, await readTags(file), id);
  } catch {
    if (id === state.loadId) onTrackFailed();
  }
}

async function applyTags(t, tags, id) {
  if (tags.title) t.title = tags.title;
  if (tags.artist) t.artist = tags.artist;
  if (tags.title || tags.artist) t.row.querySelector('span').textContent = rowLabel(t);
  let bitmap = null;
  if (tags.picture) bitmap = await createImageBitmap(tags.picture).catch(() => null);
  if (id !== state.loadId) return;
  if (state.coverUrl) URL.revokeObjectURL(state.coverUrl);
  state.coverUrl = bitmap ? URL.createObjectURL(tags.picture) : null;
  state.cover = bitmap;
  await loadSticker(t, id);
  if (id !== state.loadId) return;
  const art = bitmap || (state.sticker && state.sticker.bitmap);
  setAccent(art ? accentFromImage(art) : accentFromText(t.title));
  showTrack(t);
}

function onTrackFailed() {
  const t = current();
  toast('skipped ' + (t ? t.title : 'track') + ': cannot decode');
  if (++state.failures >= state.tracks.length) {
    state.failures = 0;
    audio.pause();
    return toast('nothing in this folder is playable');
  }
  step(state.direction, true);
}

function step(dir, wrap = state.repeat !== 'off') {
  const n = state.tracks.length;
  if (!n) return;
  state.direction = dir;
  const next = state.pos + dir;
  if (!wrap && (next < 0 || next >= n)) {
    audio.pause();
    audio.currentTime = 0;
    return;
  }
  state.pos = (next + n) % n;
  playCurrent();
}

function previous() {
  if (audio.currentTime > 3) audio.currentTime = 0;
  else step(-1, true);
}

function togglePlay() {
  if (scratch) return;
  if (!state.tracks.length) return savedHandle ? resumeSaved() : openFolder();
  initAudioGraph();
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}

audio.addEventListener('ended', () => {

  if (state.repeat === 'one') { audio.currentTime = 0; audio.play(); }
  else step(1);
});

let lastSave = 0;
function throttledSave() {

function updatePlayLabel() {

const clock = s => {
  if (!isFinite(s)) return '--:--';
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600);
  const m = Math.floor(s / 60) % 60;
  const sec = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${String(m).padStart(2, '0')}:${sec}`;
};

function updateTime() {
  const shown = state.scrub === null ? audio.currentTime : state.scrub;
  const index = state.tracks.length ? `${state.order[state.pos] + 1}/${state.tracks.length}  ` : '';
  $('time').textContent = `${index}${clock(shown)} / ${clock(audio.duration)}`;
  $('mini-cur').textContent = clock(shown);
  $('mini-dur').textContent = clock(audio.duration);
  $('mini-fill').style.width = (isFinite(audio.duration) && audio.duration ? shown / audio.duration * 100 : 0) + '%';
}

/* ---------- now playing ---------- */

function showTrack(t) {
  $('title').textContent = t.title;
  $('artist').textContent = state.cued ? `${timeWord()}${userName ? ', ' + userName : ''}. Back to this?` : t.artist;
  document.title = (t.artist ? t.artist + ' - ' : '') + t.title;
  fitTitle();
  updateTime();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title,
      artist: t.artist,
      album: state.folder,
      artwork: state.coverUrl ? [{ src: state.coverUrl }] : [],
    });

function markCurrent(t) {
  for (const row of $('list').querySelectorAll('.current')) row.classList.remove('current');
  t.row.classList.add('current');
  if ($('queue').classList.contains('open')) t.row.scrollIntoView({ block: 'nearest' });
}

/* Largest size that fits two lines of the width, capped at a third of the screen height. */
function fitTitle() {
  const el = $('title');
  el.parentElement.style.bottom = isMini() ? '' : $('bar').offsetHeight + 18 + 'px';
  if (isMini()) { el.style.fontSize = ''; return; }
  const box = el.parentElement.clientWidth;
  const maxHeight = innerHeight * .38;
  let size = Math.min(innerWidth * .16, innerHeight * .3);
  el.style.fontSize = size + 'px';
  el.style.overflowWrap = '';
  while (size > 22 && (el.scrollHeight > Math.min(size * 2.25, maxHeight) || el.scrollWidth > box)) {
    size *= .92;
    el.style.fontSize = size + 'px';
  }
  if (el.scrollWidth > box) el.style.overflowWrap = 'anywhere';
}

const accent = { r: 255, g: 77, b: 46 };
const accentTarget = { ...accent };

function hslToRgb(h, s, l) {
  const f = n => {
    const k = (n + h / 30) % 12;
    return 255 * (l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)));
  };
  return { r: f(0), g: f(8), b: f(4) };
}

let autoAccent = { ...accent };
function setAccent(colour) {
  autoAccent = colour;
  refreshAccent();
}
function refreshAccent() {
  const fixed = theme.accentMode === 'fixed';
  const source = fixed ? hexToRgb(theme.accent) : autoAccent;
  const k = !fixed && isLight(theme.bg) ? .68 : 1;
  const r = source.r * k, g = source.g * k, b = source.b * k;
  Object.assign(accentTarget, { r, g, b });
  document.documentElement.style.setProperty('--accent', `rgb(${r | 0} ${g | 0} ${b | 0})`);
}

function accentFromText(text) {
  let hash = 7;
  for (const c of text) hash = (hash * 31 + c.codePointAt(0)) >>> 0;
  return hslToRgb(hash % 360, .95, .6);
}

/* Most vivid colour on the cover, pushed bright enough to read on black. */
function accentFromImage(bitmap) {
  const c = document.createElement('canvas');
  c.width = c.height = 24;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(bitmap, 0, 0, 24, 24);
  const px = x.getImageData(0, 0, 24, 24).data;
  let best = null, bestScore = -1;
  for (let i = 0; i < px.length; i += 4) {
    const max = Math.max(px[i], px[i + 1], px[i + 2]);
    const min = Math.min(px[i], px[i + 1], px[i + 2]);
    const score = (max - min) * (max / 255);
    if (score > bestScore) { bestScore = score; best = [px[i], px[i + 1], px[i + 2]]; }
  }
  const [r, g, b] = best;
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  if (d < 24) return { r: 244, g: 242, b: 238 };
  const h = max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return hslToRgb(h * 60, .9, .62);
}

let toastTimer;
function toast(text) {
  $('toast').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3500);
}

}

  const playing = state.order[state.pos];
  state.shuffle = on;
  store.set('shuffle', on);
  if (state.crate) { state.crate.shuffle = on; memoryDirty = true; }
  showShuffle(on);
  if (state.tracks.length) buildOrder(playing);
}

function cycleRepeat() {
  const modes = ['all', 'one', 'off'];
  setRepeat(modes[(modes.indexOf(state.repeat) + 1) % 3]);
}

/* The song's own volume, scaled by a separate level that only applies in game mode. */
function applyVolume() {
  audio.volume = Math.max(0, Math.min(1, state.volume * (gameActive() ? memory.gameScale : 1)));
  $('vol-label').textContent = audio.muted ? 0 : Math.round(audio.volume * 100);
  const silent = audio.muted || audio.volume === 0;
  $('b-mute').classList.toggle('on', silent);
  $('vol-waves').setAttribute('d', silent ? 'M16 9l5 6M21 9l-5 6' : 'M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11');
  $('vol-slider').value = silent ? 0 : audio.volume;
}
function setVolume(v) {
  state.volume = Math.max(0, Math.min(1, Math.round(v * 100) / 100));
  store.set('volume', state.volume);
  applyVolume();
}
function applySongVolume(t) {
  const r = peek(t);
  state.volume = r && r.vol !== undefined ? r.vol : store.get('volume', .8);
  applyVolume();
}
const toggleMute = () => { audio.muted = !audio.muted; applyVolume(); showVolume(); };
function nudgeVolume(delta) {
  audio.muted = false;
  if (gameActive()) {
    memory.gameScale = Math.max(0, Math.min(1, (audio.volume + delta) / Math.max(state.volume, .01)));
    memoryDirty = true;
    applyVolume();
  } else {
    setVolume(state.volume + delta);
    if (current()) record(current()).vol = state.volume;
  }
  showVolume();
}
function showVolume() { if (isMini()) toast('vol ' + Math.round(audio.volume * 100)); }

function seekBy(seconds) {
  if (isFinite(audio.duration)) audio.currentTime = Math.max(0, Math.min(audio.duration - .1, audio.currentTime + seconds));
}

/* ---------- audio graph ---------- */

let analyser = null, freq = null, actx = null;

function initAudioGraph() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  actx = new AudioContext();
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = .72;
  freq = new Uint8Array(analyser.frequencyBinCount);
  actx.createMediaElementSource(audio).connect(analyser);
  analyser.connect(actx.destination);
}

/* ---------- the ring: bars are the spectrum, their colour is the seek position ---------- */

const canvas = $('stage');
const ctx = canvas.getContext('2d');
const BARS = 168;
const bars = new Float32Array(BARS);
const binFor = Array.from({ length: BARS }, (_, i) => {
  const m = 1 - Math.abs(i / BARS * 2 - 1);
  return Math.floor(Math.exp(m * Math.log(700))) + 1;
});
const geo = { w: 0, h: 0, cx: 0, cy: 0, disc: 0, ring: 0, reach: 0 };
let angle = 0, bass = 0, hover = null, lastFrame = 0;
let scratch = null;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  geo.w = innerWidth;
  geo.h = innerHeight;
  canvas.width = geo.w * dpr;
  canvas.height = geo.h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (document.body.classList.contains('compact')) {
    Object.assign(geo, { cx: geo.w / 2, cy: geo.h / 2, disc: 28, ring: 31, reach: 10 });
    return;
  }
  if (isMini()) {
    Object.assign(geo, { cx: 60, cy: 75, disc: 34, ring: 37, reach: 10 });
    return;
  }
  const panel = document.body.classList.contains('styling') && geo.w > 760 ? 380 : 0;
  geo.cx = (geo.w - panel) / 2;
  geo.cy = geo.h * .4;
  const base = Math.min((geo.w - panel) * .36, geo.h * .24) * theme.size;
  geo.disc = base * .82;
  geo.ring = base * .92;
  geo.reach = base * .46;
}

function drawDisc(rgb) {
  paintDisc(ctx, geo.cx, geo.cy, geo.disc * (1 + bass * .035), angle, discOptions(rgb));
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, .1);
  lastFrame = now;

  for (const k of ['r', 'g', 'b']) accent[k] += (accentTarget[k] - accent[k]) * .06;
  const rgb = `rgb(${accent.r | 0},${accent.g | 0},${accent.b | 0})`;

  const live = analyser && !audio.paused;
  if (live) analyser.getByteFrequencyData(freq);

  let low = 0;
  for (let i = 0; i < BARS; i++) {
    const m = 1 - Math.abs(i / BARS * 2 - 1);
    let target;
    if (live) {
      target = Math.pow(freq[binFor[i]] / 255, 2.1) * (1 + m * .9);
    } else if (!state.tracks.length && !reduceMotion) {
      target = .1 + .08 * Math.sin(now / 700 + i * .3) * Math.sin(now / 1900 + i * .075);
    } else {
      target = 0;
    }
    bars[i] += (target - bars[i]) * (target > bars[i] ? .55 : .14);
    if (m < .08) low += bars[i];
  }
  low /= Math.max(1, BARS * .08);
  bass += (Math.min(low, 1) - bass) * .25;

  if (!audio.paused && !reduceMotion) angle += dt * Math.PI * 2 * (33.3 / 60) * .35 * theme.spin;

  if (scratch && scratch.coasting) {
    rotateDisc(scratch.vel * dt);
    scratch.vel *= Math.exp(-dt * 2.2);
    if (Math.abs(scratch.vel) < .6) commitScratch();
  }
  if (audio.playbackRate < 1) {
    audio.playbackRate = Math.min(1, audio.playbackRate + dt * 1.4);
    if (audio.playbackRate === 1) audio.preservesPitch = true;
  }

  themeImages.disc = currentFrame(themeMedia.disc, now);
  themeImages.bg = currentFrame(themeMedia.bg, now);
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, geo.w, geo.h);
  if (themeImages.bg) {
    const { width: iw, height: ih } = themeImages.bg;
    const k = Math.max(geo.w / iw, geo.h / ih);
    ctx.drawImage(themeImages.bg, (geo.w - iw * k) / 2, (geo.h - ih * k) / 2, iw * k, ih * k);
    ctx.globalAlpha = theme.bgDim;
    ctx.fillRect(0, 0, geo.w, geo.h);
    ctx.globalAlpha = 1;
  }

  if (theme.glow > 0) {
    const glowR = Math.max(geo.w, geo.h) * (.45 + bass * .12);
    const glow = ctx.createRadialGradient(geo.cx, geo.cy, geo.disc * .5, geo.cx, geo.cy, glowR);
    glow.addColorStop(0, `rgba(${accent.r | 0},${accent.g | 0},${accent.b | 0},${Math.min(1, (.1 + bass * .24) * theme.glow)})`);
    glow.addColorStop(1, `rgba(${accent.r | 0},${accent.g | 0},${accent.b | 0},0)`);
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, geo.w, geo.h);
  }

  const duration = isFinite(audio.duration) ? audio.duration : 0;
  const time = state.scrub === null ? audio.currentTime : state.scrub;
  const progress = duration ? time / duration : 0;
  drawRing(rgb, progress, duration);

  if (hover !== null && duration) {
    const a = -Math.PI / 2 + hover * Math.PI * 2;
    ctx.fillStyle = theme.fg;
    ctx.beginPath();
    ctx.arc(geo.cx + Math.cos(a) * (geo.ring - 7), geo.cy + Math.sin(a) * (geo.ring - 7), 3, 0, Math.PI * 2);
    ctx.fill();
  }

  drawDisc(rgb);
  if (document.body.classList.contains('styling') && now - lastThumbs > 120) {
    lastThumbs = now;
    drawThumbs(true);
  }

  const t = current();
  const marks = t && duration && peek(t) ? peek(t).marks : [];
  ctx.fillStyle = theme.fg;
  for (const mark of marks) {
    const a = -Math.PI / 2 + mark / duration * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(geo.cx + Math.cos(a) * (geo.ring - 1), geo.cy + Math.sin(a) * (geo.ring - 1), geo.disc > 50 ? 3.5 : 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function ringHit(e) {
  const dx = e.clientX - geo.cx, dy = e.clientY - geo.cy;
  const dist = Math.hypot(dx, dy);
  const fraction = ((Math.atan2(dy, dx) + Math.PI / 2) / (Math.PI * 2) + 1) % 1;
  if (dist <= geo.disc) return { zone: 'disc' };
  if (dist <= geo.ring + geo.reach + 8) return { zone: 'ring', fraction };
  return { zone: null };
}

/* Spinning the disc: clockwise goes forward, one full turn is an eighth of the song (at least 20s). */
const pointerAngle = e => Math.atan2(e.clientY - geo.cy, e.clientX - geo.cx);

function rotateDisc(delta) {
  angle += delta;
  if (state.scrub === null) return;
  const end = Math.max(0, audio.duration - .25);
  const seconds = delta / (Math.PI * 2) * Math.max(20, audio.duration / 8);
  state.scrub = Math.max(0, Math.min(end, state.scrub + seconds));
  updateTime();
  if (scratch.coasting && (state.scrub === 0 || state.scrub === end)) scratch.vel = 0;
}

function grabDisc(e) {
  canvas.setPointerCapture(e.pointerId);
  const coasting = scratch && scratch.coasting;
  scratch = {
    a: pointerAngle(e), x: e.clientX, y: e.clientY, t: performance.now(), vel: 0,
    moved: !!coasting, coasting: false,
    resume: coasting ? scratch.resume : !audio.paused,
  };
}

function moveDisc(e) {
  if (!scratch.moved) {
    if (Math.hypot(e.clientX - scratch.x, e.clientY - scratch.y) < 3) return;
    scratch.moved = true;
    if (state.tracks.length && isFinite(audio.duration)) state.scrub = audio.currentTime;
    audio.pause();
  }
  if (Math.hypot(e.clientX - geo.cx, e.clientY - geo.cy) < 6) return;
  const a = pointerAngle(e);
  const delta = Math.atan2(Math.sin(a - scratch.a), Math.cos(a - scratch.a));
  const now = performance.now();
  const dt = Math.max(1, now - scratch.t) / 1000;
  scratch.vel = scratch.vel * .6 + delta / dt * .4;
  scratch.a = a;
  scratch.t = now;
  rotateDisc(delta);
}

function releaseDisc() {
  if (!scratch.moved) {
    scratch = null;
    return togglePlay();
  }
  const flicked = performance.now() - scratch.t < 80 && Math.abs(scratch.vel) > 2.5;
  if (flicked && !reduceMotion && state.scrub !== null) {
    scratch.vel = Math.max(-30, Math.min(30, scratch.vel));
    scratch.coasting = true;
  } else {
    commitScratch();
  }
}

/* Letting go lands the needle: the audio spins back up to speed like a real platter. */
function commitScratch() {
  const { resume, coasting } = scratch;
  scratch = null;
  if (state.scrub === null) return;
  audio.currentTime = snapToMark(state.scrub, coasting ? Math.max(8, audio.duration * .04) : 1.5);
  state.scrub = null;
  updateTime();
  updatePlayLabel();
  if (resume) {
    if (!reduceMotion) {
      audio.preservesPitch = false;
      audio.playbackRate = .55;
    }
    audio.play().catch(() => {});
  }
}

canvas.addEventListener('pointerdown', e => {
  if ($('queue').classList.contains('open')) return toggleQueue(false);
  const hit = ringHit(e);
  if (hit.zone === 'disc') grabDisc(e);
  else if (hit.zone === 'ring' && isFinite(audio.duration)) {
    canvas.setPointerCapture(e.pointerId);
    state.scrub = hit.fraction * audio.duration;
    updateTime();
  }
});
canvas.addEventListener('pointermove', e => {
  if (scratch && !scratch.coasting) {
    canvas.style.cursor = 'grabbing';
    return moveDisc(e);
  }
  const hit = ringHit(e);
  canvas.style.cursor = hit.zone === 'disc' ? 'grab' : hit.zone ? 'pointer' : 'default';
  hover = hit.zone === 'ring' ? hit.fraction : null;
  if (state.scrub !== null) {
    const dx = e.clientX - geo.cx, dy = e.clientY - geo.cy;
    hover = ((Math.atan2(dy, dx) + Math.PI / 2) / (Math.PI * 2) + 1) % 1;
    state.scrub = hover * audio.duration;
    updateTime();
  }
});
canvas.addEventListener('pointerup', () => {
  if (scratch && !scratch.coasting) {
    canvas.style.cursor = 'grab';
    return releaseDisc();
  }
  if (state.scrub !== null && !scratch) {
    audio.currentTime = state.scrub;
    state.scrub = null;
    updateTime();
  }
});
canvas.addEventListener('pointercancel', () => {
  if (scratch) return commitScratch();
  state.scrub = null;
  updateTime();
});
canvas.addEventListener('pointerleave', () => { hover = null; });

const track = $('mini-track');
function trackSeek(e) {
  const box = track.getBoundingClientRect();
  state.scrub = Math.max(0, Math.min(1, (e.clientX - box.left) / box.width)) * audio.duration;
  updateTime();
}
track.addEventListener('pointerdown', e => {
  if (!isFinite(audio.duration)) return;
  track.setPointerCapture(e.pointerId);
  trackSeek(e);
});
track.addEventListener('pointermove', e => { if (track.hasPointerCapture(e.pointerId)) trackSeek(e); });
track.addEventListener('pointerup', e => {
  if (!track.hasPointerCapture(e.pointerId)) return;
  audio.currentTime = state.scrub;
  state.scrub = null;
  updateTime();
});

/* ---------- boot ---------- */

if (native) {
  document.body.classList.add('native');
  document.body.classList.toggle('mini', new URLSearchParams(location.search).get('mode') === 'mini');
}
setRepeat(state.repeat);
setShuffle(state.shuffle);
resize();
fitTitle();
requestAnimationFrame(frame);

const TAU = Math.PI * 2;
const seeded = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 2 ** 32;

}
function grooves(c, r, o) {
  c.lineWidth = 1;

  c.strokeStyle = fgAlpha(.05 + o.wear * .12, ink);
  for (let g = r * .42; g < r; g += Math.max(2.5, r / 30)) {
    dot(c, g);
    c.stroke();
  }
}
function scuffs(c, r, o) {
  if (!o.scuffs.length) return;
  c.strokeStyle = 'rgba(255,255,255,.3)';
  c.lineWidth = 1;
  for (const s of o.scuffs) {
    c.beginPath();
    c.arc(0, 0, r * s.at, s.from, s.from + s.len);
    c.stroke();
  }
}

  c.fillStyle = o.label;
  dot(c, r * .36);
  c.fill();
  c.fillStyle = o.bg;
  dot(c, r * .035, r * .22);
  c.fill();
}
function star(c, r, inner, points) {
  c.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = i / (points * 2) * TAU - Math.PI / 2;
    const d = i % 2 ? inner : r;
    c.lineTo(Math.cos(a) * d, Math.sin(a) * d);
  }
  c.closePath();
}
function shapePath(c, shape, r) {
  c.beginPath();
  if (shape === 'circle') c.arc(0, 0, r, 0, TAU);
  else if (shape === 'square') c.rect(-r * .9, -r * .9, r * 1.8, r * 1.8);
  else if (shape === 'rounded') c.roundRect(-r * .92, -r * .92, r * 1.84, r * 1.84, r * .28);
  else if (shape === 'hex') star(c, r, r, 3);
  else if (shape === 'star') star(c, r, r * .48, 5);
  else if (shape === 'heart') {
    c.moveTo(0, r * .9);
    c.bezierCurveTo(-r * 1.3, r * .05, -r * .8, -r * 1.05, 0, -r * .4);
    c.bezierCurveTo(r * .8, -r * 1.05, r * 1.3, r * .05, 0, r * .9);
    c.closePath();
  }
}

function paintDisc(c, x, y, r, a, o) {
  const style = DISC_STYLES[o.style] || DISC_STYLES.vinyl;
  const coverFill = o.cover && o.coverMode === 'fill' && style.round;
  c.save();
  c.translate(x, y);
  c.save();
  if (style.spin !== false) c.rotate(a);
  if (coverFill) {
    c.save();
    dot(c, r);
    c.clip();
    const k = (r * 2) / Math.min(o.cover.width, o.cover.height);
    c.drawImage(o.cover, -o.cover.width * k / 2, -o.cover.height * k / 2, o.cover.width * k, o.cover.height * k);
    scuffs(c, r, o);
    c.restore();
  } else {
    c.save();
    style.paint(c, r, { ...o, angle: a });
    c.restore();
  }
  const art = o.sticker || (o.coverMode === 'label' && o.cover);
  if (art && (style.label || o.sticker)) {
    const size = r * .72;
    c.save();
    dot(c, size / 2);
    c.clip();
    const k = size / Math.min(art.width, art.height);
    c.drawImage(art, -art.width * k / 2, -art.height * k / 2, art.width * k, art.height * k);
    c.restore();
  }
  c.restore();

  if (style.sheen || coverFill) {
    c.save();
    dot(c, r);
    c.clip();
    const sheen = c.createConicGradient(Math.PI / 5, 0, 0);
    for (const [stop, alpha] of [[0, 0], [.07, .14], [.14, 0], [.5, 0], [.57, .1], [.64, 0], [1, 0]]) {
      sheen.addColorStop(stop, `rgba(255,255,255,${alpha})`);

    c.fillStyle = sheen;
    c.fillRect(-r, -r, r * 2, r * 2);
    c.restore();

  if (style.hole || coverFill) {
    c.fillStyle = o.bg;
    dot(c, r * .045);
    c.fill();
  }
  c.restore();
}

/* ---------- the ring: its shape is the spectrum, its colour is the seek position ---------- */

function drawRing(rgb, progress, duration) {
  if (theme.ring === 'none') return;
  const dim = fgAlpha(.26);
  const lit = state.tracks.length ? rgb : dim;
  const cut = duration ? progress : -1;
  const point = (i, extra) => {
    const a = -Math.PI / 2 + i / BARS * TAU;
    return [geo.cx + Math.cos(a) * (geo.ring + extra), geo.cy + Math.sin(a) * (geo.ring + extra)];
  };
  const len = i => Math.min(bars[i], 1) * geo.reach;
  const played = new Path2D(), rest = new Path2D();
  ctx.lineJoin = 'round';

  if (theme.ring === 'thin') {
    const a0 = -Math.PI / 2, reach = Math.max(0, cut) * TAU;
    rest.arc(geo.cx, geo.cy, geo.ring + 3, a0 + reach, a0 + TAU);
    played.arc(geo.cx, geo.cy, geo.ring + 3, a0, a0 + reach);
    ctx.lineCap = 'round';
    ctx.lineWidth = 2 + bass * 3;
    ctx.strokeStyle = dim; ctx.stroke(rest);
    ctx.strokeStyle = lit; if (reach) ctx.stroke(played);
    return;
  }
  if (theme.ring === 'line') {
    const stop = cut < 0 ? 0 : Math.floor(cut * BARS);
    for (let i = 0; i <= BARS; i++) {
      const [x, y] = point(i, 3 + len(i % BARS));
      if (i <= stop && cut >= 0) played.lineTo(x, y);
      if (i >= stop) rest.lineTo(x, y);
    }
    ctx.lineCap = 'round';
    ctx.lineWidth = geo.disc > 50 ? 2.5 : 1.5;
    ctx.strokeStyle = dim; ctx.stroke(rest);
    ctx.strokeStyle = lit; ctx.stroke(played);
    return;
  }
  const stride = (isMini() ? 3 : 1) * (theme.ring === 'bars' ? 1 : 2);
  const spacing = geo.ring * TAU / BARS * stride;
  for (let i = 0; i < BARS; i += stride) {
    const path = i / BARS <= cut ? played : rest;
    if (theme.ring === 'dots') {
      const [x, y] = point(i, 3 + len(i));
      const size = Math.max(1, spacing * .3);
      path.moveTo(x + size, y);
      path.arc(x, y, size, 0, TAU);
    } else {
      path.moveTo(...point(i, 0));
      path.lineTo(...point(i, 3 + len(i)));
    }
  }
  if (theme.ring === 'dots') {
    ctx.fillStyle = dim; ctx.fill(rest);
    ctx.fillStyle = lit; ctx.fill(played);
    return;
  }
  const blocks = theme.ring === 'blocks';
  ctx.lineCap = blocks ? 'butt' : 'round';
  ctx.lineWidth = blocks ? spacing * .72 : Math.max(2, geo.ring * TAU / BARS * .42);
  ctx.strokeStyle = dim; ctx.stroke(rest);
  ctx.strokeStyle = lit; ctx.stroke(played);
}

/* ---------- applying a theme ---------- */

const FONT_EXT = /\.(ttf|otf|woff2?)$/i;
const CURATED_FONTS = ['Bahnschrift', 'Segoe UI', 'Segoe UI Variable Display', 'Impact', 'Arial Black', 'Arial', 'Calibri', 'Cambria', 'Candara', 'Constantia', 'Corbel', 'Franklin Gothic Medium', 'Gabriola', 'Georgia', 'Ink Free', 'Palatino Linotype', 'Segoe Print', 'Segoe Script', 'Sitka Text', 'Tahoma', 'Times New Roman', 'Trebuchet MS', 'Verdana', 'Comic Sans MS', 'Cascadia Code', 'Consolas', 'Courier New', 'Lucida Console'];
const DEFAULT_DISPLAY = 'Bahnschrift, "DIN Condensed", "Arial Narrow", "Liberation Sans Narrow", "Segoe UI", "Noto Sans", sans-serif';
const DEFAULT_UI = '"Cascadia Code", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", "Noto Sans Mono", monospace';

function applyTheme() {
  const root = document.documentElement.style;
  root.setProperty('--bg', theme.bg);
  root.setProperty('--fg', theme.fg);
  root.setProperty('--display', fontStack(theme.displayFont, DEFAULT_DISPLAY));
  root.setProperty('--mono', fontStack(theme.uiFont, DEFAULT_UI));
  root.setProperty('--title-weight', theme.titleWeight);
  root.setProperty('--title-case', theme.titleCase === 'upper' ? 'uppercase' : 'none');
  root.setProperty('--title-blend', theme.titleColor === 'invert' ? 'difference' : 'normal');
  root.setProperty('--title-color', theme.titleColor === 'invert' ? '#fff' : theme.titleColor === 'accent' ? 'var(--accent)' : theme.fg);
  if (native) native.setBackground(theme.bg);
  refreshAccent();
  resize();
  fitTitle();
}

function setTheme(patch) {
  theme = cleanTheme({ ...theme, ...patch });
  store.set('theme', theme);
  applyTheme();
  drawThumbs();
  const note = $('style-contrast');
  if (note) note.hidden = contrast(theme.fg, theme.bg) >= 3;
}

function loadPreset(name) {
  /* Your added fonts stay available whichever preset you pick. */
  setTheme({ ...DEFAULT_THEME, ...PRESETS[name], fonts: theme.fonts });
  renderStyle();
}

function resetTheme() {
  loadPreset('Spin');
  toast('style reset');
}

/* Media: stills, animated GIF / WebP / APNG, and silent looping video, all usable as record or background. */
const themeMedia = { disc: null, bg: null };
const MEDIA_ACCEPT = 'image/*,video/mp4,video/webm';
const SKIN_EXT = /\.(wsz|wal|vlt|zip)$/i;
const isMedia = f => f.type.startsWith('image/') || f.type.startsWith('video/');
const MAX_FRAMES = 240;

async function loadMedia(blob) {
  if (blob.type.startsWith('video/')) return loadVideo(blob);
  if (window.ImageDecoder && /^image\/(gif|webp|png|apng)$/.test(blob.type)) {
    let decoder = null;
    try {
      decoder = new ImageDecoder({ data: await blob.arrayBuffer(), type: blob.type });
      await decoder.tracks.ready;
      const count = Math.min(decoder.tracks.selectedTrack.frameCount, MAX_FRAMES);
      if (count > 1) {
        const frames = [];
        let total = 0;
        for (let i = 0; i < count; i++) {
          const { image } = await decoder.decode({ frameIndex: i });
          const k = Math.min(1, 512 / Math.max(image.displayWidth, image.displayHeight));
          const bitmap = await createImageBitmap(image, { resizeWidth: Math.round(image.displayWidth * k), resizeHeight: Math.round(image.displayHeight * k) });
          const duration = Math.max(20, (image.duration || 100000) / 1000);
          image.close();
          frames.push({ bitmap, at: total });
          total += duration;
        }
        return { frames, total };
      }
    } catch {
    } finally {
      if (decoder) decoder.close();
    }
  }
  return { still: await createImageBitmap(blob) };
}

function loadVideo(blob) {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    const url = URL.createObjectURL(blob);
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.onloadeddata = () => {
      video.width = video.videoWidth;
      video.height = video.videoHeight;
      video.play().catch(() => {});
      resolve({ video, url });
    };
    video.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('cannot decode video'));
    };
    video.src = url;
  });
}

function disposeMedia(media) {
  if (!media) return;
  if (media.still) media.still.close();
  if (media.frames) media.frames.forEach(f => f.bitmap.close());
  if (media.video) {
    media.video.pause();
    URL.revokeObjectURL(media.url);
  }
}

function currentFrame(media, now) {
  if (!media) return null;
  if (media.still) return media.still;
  if (media.video) return media.video;
  const at = reduceMotion ? 0 : now % media.total;
  let frame = media.frames[0];
  for (const f of media.frames) {
    if (f.at > at) break;
    frame = f;
  }
  return frame.bitmap;
}

async function setThemeImage(slot, file, remember = true) {
  try {
    const media = await loadMedia(file);
    await handleDb('readwrite', s => s.put(file, 'theme:' + slot));
    const previous = themeMedia[slot];
    themeMedia[slot] = media;
    themeImages[slot] = currentFrame(media, performance.now());
    disposeMedia(previous);
    if (remember) await addToLibrary(file, file.name || 'image');
    if (slot === 'disc') setTheme({ disc: 'image' });
    renderStyle();
  } catch {
    toast('could not read that file');
  }
}

async function clearThemeImage(slot) {
  await handleDb('readwrite', s => s.delete('theme:' + slot)).catch(() => {});
  const previous = themeMedia[slot];
  themeMedia[slot] = null;
  themeImages[slot] = null;
  disposeMedia(previous);
  renderStyle();
}

/* ---------- library: everything you have added, kept so you can switch back ---------- */

const libraryList = () => store.get('library', []);
let libraryPick = null;
const libraryThumbs = new Map();

async function addToLibrary(blob, name, source = '') {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  await handleDb('readwrite', s => s.put(blob, 'lib:' + id));
  store.set('library', [...libraryList(), { id, name: name.slice(0, 80), type: blob.type, source }]);
  return id;
}

const libraryBlob = id => handleDb('readonly', s => s.get('lib:' + id));

async function deleteFromLibrary(id) {
  await handleDb('readwrite', s => s.delete('lib:' + id)).catch(() => {});
  store.set('library', libraryList().filter(item => item.id !== id));
  libraryThumbs.delete(id);
  if (libraryPick === id) libraryPick = null;
  renderStyle();
}

async function drawLibraryThumb(item, canvas) {
  let bitmap = libraryThumbs.get(item.id);
  if (!bitmap && !item.type.startsWith('video/')) {
    const blob = await libraryBlob(item.id).catch(() => null);
    bitmap = blob ? await createImageBitmap(blob, { resizeWidth: 128, resizeQuality: 'medium' }).catch(() => null) : null;
    if (bitmap) libraryThumbs.set(item.id, bitmap);
  }
  const x = canvas.getContext('2d');
  if (bitmap) {
    const k = Math.min(128 / bitmap.width, 128 / bitmap.height);
    x.drawImage(bitmap, (128 - bitmap.width * k) / 2, (128 - bitmap.height * k) / 2, bitmap.width * k, bitmap.height * k);
  } else {
    x.fillStyle = theme.fg;
    x.font = '40px sans-serif';
    x.textAlign = 'center';
    x.fillText('▶', 64, 80);
  }
}

async function saveBlob(blob, name) {

/* ---------- zip: enough to read skin files and write an export, with no dependency ---------- */

const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
  for (let k = 0; k < 8; k++) n = n & 1 ? 0xedb88320 ^ (n >>> 1) : n >>> 1;
  return n >>> 0;
});
function crc32(bytes) {
  let crc = 0xffffffff;
  for (const b of bytes) crc = CRC_TABLE[(crc ^ b) & 255] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}

function buildZip(files) {
  const encoder = new TextEncoder();
  const used = new Set();
  const parts = [], central = [];
  let offset = 0;
  for (const file of files) {
    let name = file.name.replace(/[\\/:*?"<>|]/g, '_');
    while (used.has(name)) name = '_' + name;
    used.add(name);
    const nameBytes = encoder.encode(name);
    const crc = crc32(file.data);
    const common = new DataView(new ArrayBuffer(26));
    common.setUint16(0, 20, true);
    common.setUint16(2, 0x0800, true);
    common.setUint32(10, crc, true);
    common.setUint32(14, file.data.length, true);
    common.setUint32(18, file.data.length, true);
    common.setUint16(22, nameBytes.length, true);
    const local = new Uint8Array(30);
    new DataView(local.buffer).setUint32(0, 0x04034b50, true);
    local.set(new Uint8Array(common.buffer), 4);
    parts.push(local, nameBytes, file.data);
    const entry = new Uint8Array(46);
    const view = new DataView(entry.buffer);
    view.setUint32(0, 0x02014b50, true);
    view.setUint16(4, 20, true);
    entry.set(new Uint8Array(common.buffer), 6);
    view.setUint32(42, offset, true);
    central.push(entry, nameBytes);
    offset += 30 + nameBytes.length + file.data.length;
  }
  const centralSize = central.reduce((sum, p) => sum + p.length, 0);
  const end = new Uint8Array(22);
  const endView = new DataView(end.buffer);
  endView.setUint32(0, 0x06054b50, true);
  endView.setUint16(8, files.length, true);
  endView.setUint16(10, files.length, true);
  endView.setUint32(12, centralSize, true);
  endView.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}

async function readZip(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  let end = bytes.length - 22;
  while (end >= 0 && view.getUint32(end, true) !== 0x06054b50) end--;
  if (end < 0) throw new Error('not a zip');
  const count = Math.min(view.getUint16(end + 10, true), 1000);
  let at = view.getUint32(end + 16, true);
  const decoder = new TextDecoder();
  const out = [];
  for (let i = 0; i < count; i++) {
    if (view.getUint32(at, true) !== 0x02014b50) break;
    const method = view.getUint16(at + 10, true);
    const packed = view.getUint32(at + 20, true);
    const size = view.getUint32(at + 24, true);
    const nameLength = view.getUint16(at + 28, true);
    const extra = view.getUint16(at + 30, true);
    const comment = view.getUint16(at + 32, true);
    const local = view.getUint32(at + 42, true);
    const name = decoder.decode(bytes.subarray(at + 46, at + 46 + nameLength));
    at += 46 + nameLength + extra + comment;
    if (name.endsWith('/') || size > 3e7) continue;
    const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
    const data = bytes.subarray(start, start + packed);
    if (method === 0) out.push({ name, data });
    else if (method === 8) {
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      out.push({ name, data: new Uint8Array(await new Response(stream).arrayBuffer()) });
    }
  }
  return out;
}

const IMAGE_TYPES = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp', webp: 'image/webp', apng: 'image/apng' };

/* Takes a skin you already have, keeps its bigger images, and turns its playlist colours into a style. */
async function importSkin(file) {
  const skin = file.name.replace(SKIN_EXT, '');
  try {
    const entries = await readZip(await file.arrayBuffer());
    let added = 0;
    for (const { name, data } of entries) {
      const type = IMAGE_TYPES[name.split('.').pop().toLowerCase()];
      if (!type) continue;
      const blob = new Blob([data], { type });
      const size = await createImageBitmap(blob).catch(() => null);
      if (!size) continue;
      const big = size.width >= 64 && size.height >= 32;
      size.close();
      if (big && added < 60) {
        await addToLibrary(blob, skin + ' - ' + name.split('/').pop(), skin);
        added++;
      }
    }
    const pledit = entries.find(e => /(^|\/)pledit\.txt$/i.test(e.name));
    let styled = false;
    if (pledit) {
      const text = new TextDecoder('latin1').decode(pledit.data);
      const colour = key => {
        const m = text.match(new RegExp('^\\s*' + key + '\\s*=\\s*#?([0-9a-f]{6})', 'im'));
        return m ? '#' + m[1].toLowerCase() : null;
      };
      const patch = { bg: colour('NormalBG'), fg: colour('Normal'), accent: colour('Current') };
      if (patch.bg && patch.fg) {
        /* Some skins use dim playlist text that would be unreadable at this size. */
        if (contrast(patch.fg, patch.bg) < 4.5) patch.fg = isLight(patch.bg) ? '#000000' : '#ffffff';
        const next = { ...theme, bg: patch.bg, fg: patch.fg, titleColor: 'fg', discColor: patch.bg };
        if (patch.accent) { next.accentMode = 'fixed'; next.accent = patch.accent; }
        store.set('themes', { ...store.get('themes', {}), [skin]: next });
        setTheme(next);
        styled = true;
      }
    }
    toast(`${skin}: ${added} image${added === 1 ? '' : 's'}${styled ? ' and colours' : ''}`);
    renderStyle();
  } catch {
    toast('could not read that skin file');
  }
}

async function loadFontFace(name, data) {
  const face = new FontFace(name, data);
  await face.load();
  document.fonts.add(face);
}

async function addFont(file) {
  const name = file.name.replace(FONT_EXT, '');
  try {
    const data = await file.arrayBuffer();
    await loadFontFace(name, data);
    await handleDb('readwrite', s => s.put(data, 'theme:font:' + name));
    setTheme({ fonts: [...new Set([...theme.fonts, name])], displayFont: name });
    renderStyle();
    toast('font added: ' + name);
  } catch {
    toast('could not read that font');
  }
}

async function loadThemeAssets() {
  for (const slot of ['disc', 'bg']) {
    const blob = await handleDb('readonly', s => s.get('theme:' + slot)).catch(() => null);
    if (blob) themeMedia[slot] = await loadMedia(blob).catch(() => null);
  }
  for (const name of theme.fonts) {
    const data = await handleDb('readonly', s => s.get('theme:font:' + name)).catch(() => null);
    if (data) await loadFontFace(name, data).catch(() => {});
  }
  fitTitle();
}

let installedFonts = null;
let thumbs = [];
let lastThumbs = 0;

async function listFonts() {
  if (installedFonts) return installedFonts;
  installedFonts = CURATED_FONTS;
  if (window.queryLocalFonts) {
    try {
      const found = (await queryLocalFonts()).map(f => f.family);

    } catch {}
  }

function toggleStyle(open = !document.body.classList.contains('styling')) {
  if (open === document.body.classList.contains('styling')) return;
  document.body.classList.toggle('styling', open);
  if (open) {
    state.styleFromMini = isMini();
    if (isMini()) setWindowMode('full');
    renderStyle();
    listFonts().then(() => { if (document.body.classList.contains('styling')) renderStyle(); });
  } else if (state.styleFromMini) {
    setWindowMode('mini');
  }
