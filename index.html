}

function drawThumbs(animatedOnly = false) {
  const rgb = `rgb(${accentTarget.r | 0},${accentTarget.g | 0},${accentTarget.b | 0})`;
  for (const { canvas: c, style } of thumbs) {
    if (animatedOnly && !DISC_STYLES[style].animated) continue;
    const x = c.getContext('2d');
    x.setTransform(2, 0, 0, 2, 0, 0);
    x.clearRect(0, 0, 64, 64);
    paintDisc(x, 32, 32, 28, .6, { ...discOptions(rgb), style, cover: null, sticker: null, wear: 0, scuffs: [] });
  }
}

function field(text, control) {
  const row = el('label', 'field');
  row.append(el('span', '', text), control);
  return row;
}
function colourField(text, key) {
  const input = el('input');
  input.type = 'color';
  input.value = theme[key];
  input.setAttribute('aria-label', text);
  input.addEventListener('input', () => setTheme({ [key]: input.value }));
  return field(text, input);
}
function rangeField(text, key, min, max, step) {
  const input = el('input');
  input.type = 'range';
  Object.assign(input, { min, max, step, value: theme[key] });
  input.setAttribute('aria-label', text);
  input.addEventListener('input', () => setTheme({ [key]: Number(input.value) }));
  return field(text, input);
}
function selectField(text, key, options) {
  const select = el('select');
  select.setAttribute('aria-label', text);
  for (const [value, name] of options) {
    const option = el('option', '', name);
    option.value = value;
    select.append(option);
  }
  select.value = theme[key];
  select.addEventListener('change', () => { setTheme({ [key]: select.value }); renderStyle(); });
  return field(text, select);
}
function chipRow(items) {
  const row = el('div', 'chips');

function pickFile(accept, run) {

}
const fontOptions = () => [['', 'Default'], ...[...new Set([...theme.fonts, ...(installedFonts || CURATED_FONTS)])].map(f => [f, f])];

function exportTheme() {

function renderStyle() {

  thumbs = [];
  for (const [style, info] of Object.entries(DISC_STYLES)) {

  const picked = library.find(item => item.id === libraryPick);
  nodes.push(chipRow([
    ['add gif, image or video', false, () => pickFile(MEDIA_ACCEPT, f => setThemeImage('disc', f))],
    ['import skin', false, () => pickFile('.wsz,.wal,.vlt,.zip', importSkin)],

    ...(picked ? [
      ['use as background', false, async () => setThemeImage('bg', await libraryBlob(picked.id), false)],
      ['export', false, async () => saveBlob(await libraryBlob(picked.id), picked.name)],
      ['delete', false, () => deleteFromLibrary(picked.id)],

  nodes.push(el('h2', '', 'ring'), chipRow(THEME_CHOICES.ring.map(ring => [ring, theme.ring === ring, () => { setTheme({ ring }); renderStyle(); }])));
  nodes.push(rangeField('glow', 'glow', 0, 2, .1));

  nodes.push(el('h2', '', 'colours'), colourField('background', 'bg'), colourField('text', 'fg'),
    selectField('accent', 'accentMode', [['auto', 'from each song'], ['fixed', 'always the same']]));
  if (theme.accentMode === 'fixed') nodes.push(colourField('accent colour', 'accent'));
  nodes.push(selectField('big title', 'titleColor', [['invert', 'invert over the ring'], ['fg', 'text colour'], ['accent', 'accent colour']]));
  const warn = el('div', 'note', 'text is hard to read on this background. shift+t resets.');
  warn.id = 'style-contrast';

  nodes.push(el('h2', '', 'background'), chipRow([

  if (themeMedia.bg) nodes.push(rangeField('dim', 'bgDim', 0, 1, .05));

  nodes.push(el('h2', '', 'fonts'),
    selectField('title', 'displayFont', fontOptions()),
    selectField('everything else', 'uiFont', fontOptions()),
    rangeField('title weight', 'titleWeight', 100, 900, 100),
    selectField('title case', 'titleCase', [['upper', 'UPPERCASE'], ['none', 'as written']]),
    chipRow([['add font file', false, () => pickFile('.ttf,.otf,.woff,.woff2', addFont)]]),
    el('div', 'hint', 'ttf, otf or woff. You can also drop a font file on the window.'));

  const saveName = el('input');
  saveName.type = 'text';
  saveName.placeholder = 'name this style';
  saveName.setAttribute('aria-label', 'Name for this style');
  const save = () => {
    const name = saveName.value.trim();

  saveName.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  nodes.push(el('h2', '', 'keep and share'), field('save as', saveName), chipRow([
    ['save', false, save],
    ['export', false, exportTheme],
    ['import', false, () => pickFile('.json', importTheme)],
    ['reset', false, resetTheme],
    ...Object.keys(mine).map(name => ['delete ' + name, false, () => {
      const left = { ...mine };
      delete left[name];
      store.set('themes', left);
      renderStyle();
    }]),
  ]), el('div', 'hint', 'Exports leave out images and font files. Esc closes this panel.'));

  panel.replaceChildren(...nodes);
  panel.scrollTop = keep;
  drawThumbs();
}

let userName = '';

function timeWord() {
  const h = new Date().getHours();
  return h < 5 ? 'Still up' : h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';
}

function showGreeting() {

  $('artist').textContent = 'press o to open a folder';

/* Wear: the more a song is played, the more worn its record looks. Same song, same scratches. */
function loadWear(t) {
  const plays = peek(t) ? peek(t).plays : 0;
  state.wear = 1 - Math.exp(-plays / 25);
  let seed = 7;
  for (const c of t.key) seed = (seed * 31 + c.codePointAt(0)) >>> 0;
  const random = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32;
  state.scuffs = Array.from({ length: Math.round(state.wear * 16) }, () => ({
    at: .42 + random() * .56, from: random() * Math.PI * 2, len: .1 + random() * .5,
  }));
}

/* Marks: moments you love, shown as notches on the ring. The record snaps to them. */
function toggleMark() {
  const t = current();
  if (!t || !isFinite(audio.duration)) return;
  const r = record(t);
  const near = r.marks.findIndex(m => Math.abs(m - audio.currentTime) < 2);
  if (near >= 0) {
    r.marks.splice(near, 1);
    toast('mark removed');
  } else {
    r.marks.push(audio.currentTime);
    r.marks.sort((a, b) => a - b);
    toast('marked ' + clock(audio.currentTime));
  }
}

function jumpMark(dir) {
  const t = current();
  const marks = t && peek(t) ? peek(t).marks : [];
  const now = audio.currentTime;
  const target = dir > 0 ? marks.find(m => m > now + 1) : [...marks].reverse().find(m => m < now - 1);
  if (target === undefined) return toast(marks.length ? 'no more marks' : 'no marks: press b to add one');
  audio.currentTime = target;
}

function snapToMark(time, reach) {
  const t = current();
  const marks = t && peek(t) ? peek(t).marks : [];
  let best = time, bestGap = reach;
  for (const m of marks) {
    if (Math.abs(m - time) <= bestGap) { best = m; bestGap = Math.abs(m - time); }
  }
  return best;
}

/* Stickers: images on the record's centre label, for a song, its album folder, or everything. */
const stickerKeys = t => ({
  song: 'sticker:song:' + t.key,
  album: 'sticker:album:' + t.key.slice(0, t.key.lastIndexOf('/')),
  app: 'sticker:app',
});

async function setSticker(file, scope) {
  const t = current();
  if (!t) return toast('play something first');
  try {
    const source = await createImageBitmap(file);
    const c = document.createElement('canvas');
    const k = 320 / Math.min(source.width, source.height);
    c.width = Math.round(source.width * k);
    c.height = Math.round(source.height * k);
    c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
    await handleDb('readwrite', s => s.put(blob, stickerKeys(t)[scope]));
    toast('sticker: ' + (scope === 'song' ? 'this song' : scope === 'album' ? 'this folder' : 'every song'));
    await refreshSticker(t);
  } catch {
    toast('could not read that image');
  }
}

async function loadSticker(t, id) {
  const keys = stickerKeys(t);
  for (const key of [keys.song, keys.album, keys.app]) {
    const blob = await handleDb('readonly', s => s.get(key)).catch(() => null);
    if (id !== state.loadId) return;
    const bitmap = blob ? await createImageBitmap(blob).catch(() => null) : null;
    if (id !== state.loadId) return;
    if (bitmap) {
      state.sticker = { bitmap };
      state.stickerKey = key;
      return;
    }
  }
  state.sticker = null;
  state.stickerKey = null;
}

async function refreshSticker(t) {
  await loadSticker(t, state.loadId);
  if (state.cover) return;
  setAccent(state.sticker ? accentFromImage(state.sticker.bitmap) : accentFromText(t.title));
}

async function removeSticker() {
  const t = current();
  if (!t || !state.stickerKey) return toast('no sticker here');
  await handleDb('readwrite', s => s.delete(state.stickerKey)).catch(() => {});
  toast('sticker removed');
  await refreshSticker(t);
}

/* Game mode: while a game has the foreground, the widget is just the record until you hover it. */
let gameDetected = false, gameForced = null, pointerInside = false, collapseTimer = null, compactWanted = false, compactBusy = false;
function gameActive() { return gameForced === null ? gameDetected : gameForced; }

function refreshGame() {
  applyVolume();
  syncCompact();
}

function toggleGame() {
  if (!native) return toast('game mode is in the desktop app');
  gameForced = !gameActive();
  toast('game mode ' + (gameForced ? 'on' : 'off'));
  refreshGame();
}

async function syncCompact() {
  if (!native) return;
  compactWanted = gameActive() && isMini() && !pointerInside && !state.sheet && !document.body.classList.contains('styling');
  if (compactBusy) return;
  compactBusy = true;
  while (compactWanted !== document.body.classList.contains('compact')) {
    const on = await native.setCompact(compactWanted);
    document.body.classList.toggle('compact', on);
    resize();
    if (on !== compactWanted && !isMini()) break;
  }
  compactBusy = false;
}

document.documentElement.addEventListener('mouseenter', () => {
  pointerInside = true;
  clearTimeout(collapseTimer);
  syncCompact();
});
document.documentElement.addEventListener('mouseleave', () => {
  clearTimeout(collapseTimer);
  collapseTimer = setTimeout(async () => {
    /* Resizing makes Chromium report a leave even under a still pointer, so check where it really is. */
    if (scratch || (native && await native.cursorInside())) return;
    pointerInside = false;
    syncCompact();
  }, 1200);
});

/* Sheets: the few full-window pages. Opened from the widget, closing one returns to the widget. */
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

function openSheet(name, nodes) {
  if (!state.sheet) state.sheetFromMini = isMini();
  state.sheet = name;
  if (isMini()) setWindowMode('full');
  const box = el('div');
  box.append(...nodes);
  $('sheet').replaceChildren(box);
  $('sheet').classList.add('open');
}

function closeSheet() {
  state.sheet = null;
  $('sheet').classList.remove('open');
  if (state.sheetFromMini) setWindowMode('mini');
}

$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });

function openHelp() {
  const keys = [
    ['t', 'style: colours, fonts, record, ring. right-click the record works too'],
    ['shift+t', 'reset the style to default'],
    ['b', 'mark this moment, again to remove'],
    ['[  ]', 'jump between marks'],
    ['i', 'choose a sticker for this song'],
    ['drop an image', 'sticker for this song. shift: its folder. ctrl or cmd: every song'],
    ['x', 'remove the sticker'],
    ['c', 'crates: switch folders'],
    ['y', 'your year in music'],
    ['g', 'game mode on or off'],
    ['e', 'mini or full view'],
    ['f', 'fullscreen'],
    ['/', 'filter tracks'],
    [',', 'open settings.json: name, global hotkeys, games'],
  ].filter(([key]) => native || !['c', 'g', 'e', ','].includes(key));
  openSheet('help', [
    el('div', 'sheet-big', 'Keys'),
    el('div', 'sheet-sub', 'esc to close'),
    ...keys.map(([key, text]) => {
      const row = el('div', 'sheet-row');
      const k = el('i', '', key);
      k.style.width = '130px';
      row.append(k, el('span', '', text));
      return row;
    }),
  ]);
}

function openReview() {
  const year = new Date().getFullYear();
  const songs = Object.values(memory.tracks)
    .filter(r => r.years[year] && r.title)
    .sort((a, b) => b.years[year] - a.years[year]);
  const seconds = songs.reduce((sum, r) => sum + r.years[year], 0);
  if (seconds < 60) {
    return openSheet('review', [el('div', 'sheet-big', String(year)), el('div', 'sheet-sub', 'Nothing to look back on yet. Play something.')]);
  }
  const artists = {};
  const byHour = {};
  for (const r of songs) {
    if (r.artist) artists[r.artist] = (artists[r.artist] || 0) + r.years[year];
    for (const [h, n] of Object.entries(r.hours)) byHour[h] = (byHour[h] || 0) + n;
  }
  const topArtists = Object.entries(artists).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const topHour = Object.entries(byHour).sort((a, b) => b[1] - a[1])[0];
  const row = (label, value) => {
    const node = el('div', 'sheet-row');
    const name = el('span', '', label);
    name.dir = 'auto';
    node.append(name, el('i', '', value));
    return node;
  };
  const spent = s => (s >= 3600 ? (s / 3600).toFixed(1) + ' h' : s < 60 ? '<1 min' : Math.round(s / 60) + ' min');
  const parts = [String(year)];
  if (userName) parts[0] += ', ' + userName;
  if (topHour) parts.push('Mostly around ' + String(topHour[0]).padStart(2, '0') + ':00');
  parts.push('Only stored on this computer');
  openSheet('review', [
    el('div', 'sheet-big', seconds >= 3600 ? (seconds / 3600).toFixed(1) + ' hours' : Math.round(seconds / 60) + ' min'),
    el('div', 'sheet-sub', parts.join('. ')),
    el('div', 'sheet-title', 'top songs'),
    ...songs.slice(0, 5).map(r => row((r.artist ? r.artist + ' - ' : '') + r.title, spent(r.years[year]))),
    ...(topArtists.length ? [el('div', 'sheet-title', 'top artists'), ...topArtists.map(([a, s]) => row(a, spent(s)))] : []),
  ]);
}

/* Crates: named folders, each keeping its own place and shuffle setting. */
async function switchCrate(crate) {
  savePosition();
  saveMemory();
  closeSheet();
  try {
    await openNative(crate.folder, true);
  } catch {
    toast('folder is gone: ' + crate.folder);
  }
}

function openCrates() {
  if (!native) return toast('crates are in the desktop app');
  const rows = memory.crates.map((crate, i) => {
    const row = el('div', 'sheet-row' + (crate === state.crate ? ' current' : ''));
    const open = el('button', 'crate-open', crate.name);
    open.dir = 'auto';
    open.addEventListener('click', () => switchCrate(crate));
    const rename = el('button', 'crate-action', 'rename');
    rename.addEventListener('click', () => {
      const input = el('input');
      input.value = crate.name;
      input.setAttribute('aria-label', 'Crate name');
      row.replaceChild(input, open);
      input.focus();
      input.select();
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && input.value.trim()) {
          crate.name = input.value.trim();
          memoryDirty = true;
          openCrates();
        } else if (e.key === 'Escape') {
          openCrates();
        }
      });
    });
    row.append(el('i', '', String(i + 1)), open, rename);
    if (crate !== state.crate) {
      const remove = el('button', 'crate-action', 'remove');
      remove.addEventListener('click', () => {
        memory.crates.splice(i, 1);
        memoryDirty = true;
        openCrates();
      });
      row.append(remove);
    }
    return row;
  });
  const add = el('button', 'sheet-add', '+ add a folder');
  add.addEventListener('click', () => { closeSheet(); openFolder(); });
  openSheet('crates', [
    el('div', 'sheet-big', 'Crates'),
    el('div', 'sheet-sub', 'each keeps its own place and shuffle. number keys to switch, esc to close'),
    ...rows,
    add,
  ]);
}

async function boot() {
  applyTheme();
  loadThemeAssets();
  if (native) {
    native.onCommand(command => ({
      playPause: togglePlay,
      next: skipNext,
      previous,
      volumeUp: () => nudgeVolume(.05),
      volumeDown: () => nudgeVolume(-.05),
      mark: toggleMark,
    }[command] || (() => {}))());
    native.onGame(game => {
      gameDetected = game.active;
      gameForced = null;
      refreshGame();
    });
    native.onConfig(config => {
      userName = config.name || '';
      if (config.error) toast('settings.json has an error, keeping the old settings');
      else if (config.failedHotkeys.length) toast('hotkey taken: ' + config.failedHotkeys.join(', '));
      if (!state.tracks.length) showGreeting();
    });
    const config = await native.config();
    userName = config.name || '';
    if (config.failedHotkeys.length) toast('hotkey taken: ' + config.failedHotkeys.join(', '));
    memory = { ...memory, ...(await native.loadMemory() || {}) };
  } else {
    memory = { ...memory, ...store.get('memory', {}) };
  }
  applyVolume();
  showGreeting();

  /* The app reopens the last folder at launch, cued and paused so it never starts blasting. */
  if (native) {
    const folder = store.get('folder', null);
    if (folder) openNative(folder, false).catch(() => toast('last folder is gone: ' + folder));
    return;
  }
  const handle = await loadHandle();
  if (!handle) return;
  savedHandle = handle;
  $('title').textContent = 'Resume ' + handle.name;
  $('artist').textContent = 'space to continue, o for another folder';
  fitTitle();
}
boot();
</script>
